name: Retention purge

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge expired records
        env:
          APP_URL: ${{ secrets.APP_URL }}
          RETENTION_PURGE_TOKEN: ${{ secrets.RETENTION_PURGE_TOKEN }}
        run: |
          set -eu
          test -n "$APP_URL"
          test -n "$RETENTION_PURGE_TOKEN"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $RETENTION_PURGE_TOKEN" \
            --data '' \
            "$APP_URL/api/internal/retention"
